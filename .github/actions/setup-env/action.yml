name: Set up Python environment
description: Install uv, Python 3.12, and the project's dev dependencies (cached).

# Shared by the lint, test, and test-ui (Playwright) workflows so the
# uv/python/sync block has one definition and consistent caching. A local
# composite action requires the repo already checked out, so each caller runs
# actions/checkout@v6 before `uses: ./.github/actions/setup-env`.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12
      shell: bash

    - name: Install dependencies
      run: uv sync --extra dev --frozen
      shell: bash
