version: 2

# Weekly updates across every ecosystem the repo uses, each collapsed into a
# single grouped pull request so reviews stay batched rather than one PR per
# dependency.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"

  # Tracks Alpine.js, the web UI's local-interaction layer, through the npm
  # manifest in /frontend. That manifest exists only so Dependabot can watch the
  # pinned package and so the vendored static asset can be refreshed from it
  # (`npm ci && npm run vendor`); it is not a runtime or application build step.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
