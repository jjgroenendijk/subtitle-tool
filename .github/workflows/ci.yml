name: CI

# Two sequential jobs so the cheap checks fail before the slower suite starts:
# `lint` (ruff plus Markdown format/lint) gates `test` (pytest with the coverage
# gate) through `needs`, so the test job never starts on a branch that fails
# linting. Distinct job names make a failure's origin obvious in the Actions UI.
# Both jobs run in the normal push/pull_request context (no workflow_run), so PR
# checks are posted on the PR commit and no privileged checkout of untrusted code
# happens. A future Playwright browser suite (issue #114) can be added as a
# `test-ui` job that also `needs: lint`, or as a separate `test-ui.yml`.
on:
  push:
  pull_request:

# Minimal token: jobs only read the checked-out source.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # No ffmpeg here: none of the lint tools need it.
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Markdown format check
        run: uv run mdformat --check $(git ls-files '*.md')

      - name: Markdown lint
        run: uv run pymarkdown scan $(git ls-files '*.md')

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Test with coverage gate
        # --cov reads source and the fail_under threshold from pyproject.toml's
        # [tool.coverage] tables, so CI fails when application coverage drops
        # below the agreed minimum.
        run: uv run pytest --cov
