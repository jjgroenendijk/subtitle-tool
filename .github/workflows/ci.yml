name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mdformat --check $(git ls-files '*.md')
          uv run pymarkdown scan $(git ls-files '*.md')

      - name: Test with coverage gate
        # --cov reads source and the fail_under threshold from pyproject.toml's
        # [tool.coverage] tables, so CI fails when application coverage drops
        # below the agreed minimum.
        run: uv run pytest --cov
