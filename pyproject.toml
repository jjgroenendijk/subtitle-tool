[project]
name = "subtitle-tool"
version = "0.1.0"
description = "Self-hosted tool that keeps Plex subtitle files clean and consistently named"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "pysubs2>=1.7",
    "charset-normalizer>=3.3",
    "lingua-language-detector>=2.0",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "python-multipart>=0.0.9",
    "watchdog>=6.0.0",
    "ffsubsync>=0.5.0",
    "iso639-lang>=2.6.3",
    "srt>=3.5.3",
    "pathspec>=0.12",
]

[project.scripts]
subtitle-tool = "subtitle_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "playwright>=1.44",
    "mdformat>=0.7",
    "mdformat-gfm>=0.4",
    "pymarkdownlnt>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tool"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PIE",
    "RET",
    "RSE",
    "ICN",
    "TID",
    "FURB",
    "LOG",
    "ISC",
    "INP",
    "G",
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "ERA",   # eradicate
    "FAST",  # FastAPI-specific checks
    "PERF",  # Perflint
    "PTH",   # flake8-use-pathlib
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts are how tests state expectations
    "ARG",    # test doubles mirror real signatures, including unused params
    "S603",   # fixture builders invoke ffmpeg/ffprobe directly, no shell
    "S607",   # fixture builders call ffmpeg by name on PATH
]

# Coverage measures only the application package; tests are excluded from the
# reported total. The gate command is `uv run pytest --cov` (see AGENTS.md and
# .githooks/README.md). fail_under is the agreed minimum threshold and the
# single source of truth for it, kept low enough to leave room for the
# intentionally hard-to-cover subprocess and safety branches.
[tool.coverage.run]
source = ["src/subtitle_tool"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# PyMarkdown rule configuration. pymarkdown discovers this table when run from
# the repo root (`uv run pymarkdown scan ...`). Only MD013 is tuned: it is
# disabled by default, so it is enabled here at 100 to match mdformat's 100
# column wrap. Category-specific lengths (headings, tables, code blocks) have
# their own defaults independent of `line_length`, so each is set explicitly.
[tool.pymarkdown]
plugins.md013.enabled = true
plugins.md013.line_length = 100
plugins.md013.heading_line_length = 100
plugins.md013.table_line_length = 100
plugins.md013.code_block_line_length = 100
plugins.md013.headings = true
plugins.md013.tables = true
plugins.md013.code_blocks = true
