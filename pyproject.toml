[project]
name = "subtitle-tool"
version = "0.1.0"
description = "Self-hosted tool that keeps Plex subtitle files clean and consistently named"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pysubs2>=1.7",
    "charset-normalizer>=3.4.9",
    "lingua-language-detector>=2.0",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "python-multipart>=0.0.9",
    "watchdog>=6.0.0",
    "ffsubsync>=0.5.1",
    "iso639-lang>=2.6.3",
    "srt>=3.5.3",
    "pathspec>=0.12",
]

[project.scripts]
subtitle-tool = "subtitle_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
    "httpx>=0.27",
    "playwright>=1.61.0",
    "mdformat>=0.7",
    "mdformat-gfm>=0.4",
    "pymarkdownlnt>=0.9.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tool"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect the Playwright browser suite by default so `uv run pytest` and the
# `uv run pytest --cov` coverage gate stay fast, headless-browser-free, and
# unchanged. The browser suite is opt-in via `uv run pytest -m browser` (a later
# `-m` overrides this one), which CI runs in its own job after installing
# Chromium. See tests/browser/ and .github/workflows/test-ui.yml.
addopts = "-ra -m 'not browser'"
markers = [
    "browser: Playwright tests that drive the UI in a real Chromium browser.",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PIE",
    "RET",
    "RSE",
    "ICN",
    "TID",
    "FURB",
    "LOG",
    "ISC",
    "INP",
    "G",
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "ERA",   # eradicate
    "FAST",  # FastAPI-specific checks
    "PERF",  # Perflint
    "PTH",   # flake8-use-pathlib
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "TC",    # flake8-type-checking
    "ANN",   # flake8-annotations
    "FBT",   # flake8-boolean-trap
    "N",     # pep8-naming
    # Selected high-signal Pylint-derived rules only, not full PL: the broad PL
    # families (PLR magic values, refactor suggestions) are too noisy for a small
    # codebase. These three each catch a concrete correctness or clarity hazard.
    "PLW1510",  # subprocess.run must state check= explicitly
    "PLW0603",  # global statement (pressure away from module-level mutable state)
    "PLW0108",  # unnecessary lambda wrapping a bare call
    "SLF",   # flake8-self (private member access)
]

# Opinionated families deliberately left off in this phase (issue #79):
#   EM      - exception message variable style; broad churn for little gain.
#   TRY     - exception-flow style; useful but verbose and opinionated.
#   T20     - flake8-print; the CLI reports to stdout via print on purpose.
#   PLR2004 - magic-value checks; noisy in tests where the literal is clearer.
# Full PL is intentionally not enabled; only the three PLW subrules above are.

# ANN401 (typing.Any) stays off: the form/config layer (web/forms.py) and the
# JSON serializers deliberately accept and return dynamically-shaped values
# (form fields, nested config dicts, Pydantic field info), where a precise type
# would be a lie. Banning Any there would force noise without improving the
# contract, and the issue tracking this work calls out keeping Pydantic/FastAPI
# introspection readable.
ignore = ["ANN401"]

# Pydantic resolves field annotations at runtime to build validators, and these
# modules use `from __future__ import annotations`, so an import used only in a
# model field must stay a real runtime import, not move behind TYPE_CHECKING.
# Tell flake8-type-checking that BaseModel subclasses evaluate their annotations
# so TC leaves those imports alone (e.g. Path in scanner/models.py). Plain
# dataclasses do not evaluate annotations, so their type-only imports are still
# correctly moved behind TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # asserts are how tests state expectations
    "ARG",    # test doubles mirror real signatures, including unused params
    "S603",   # fixture builders invoke ffmpeg/ffprobe directly, no shell
    "S607",   # fixture builders call ffmpeg by name on PATH
    "ANN",    # test functions, fixtures, and inline spies mirror real or pytest
              # signatures; annotating them adds noise without sharpening any
              # contract the application depends on
    "N818",   # throwaway test exceptions (e.g. `class Boom`) simulate crashes;
              # forcing an Error suffix on them adds noise without clarifying intent
    "SLF001", # tests deliberately reach into internals (scheduler/watcher state)
              # to drive components in isolation; that is the point of a unit test
]

# Coverage measures only the application package; tests are excluded from the
# reported total. The gate command is `uv run pytest --cov` (see AGENTS.md and
# .githooks/README.md). fail_under is the agreed minimum threshold and the
# single source of truth for it, kept low enough to leave room for the
# intentionally hard-to-cover subprocess and safety branches.
[tool.coverage.run]
source = ["src/subtitle_tool"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# PyMarkdown rule configuration. pymarkdown discovers this table when run from
# the repo root (`uv run pymarkdown scan ...`). Only MD013 is tuned: it is
# disabled by default, so it is enabled here at 100 to match mdformat's 100
# column wrap. Category-specific lengths (headings, tables, code blocks) have
# their own defaults independent of `line_length`, so each is set explicitly.
[tool.pymarkdown]
plugins.md013.enabled = true
plugins.md013.line_length = 100
plugins.md013.heading_line_length = 100
plugins.md013.table_line_length = 100
plugins.md013.code_block_line_length = 100
plugins.md013.headings = true
plugins.md013.tables = true
plugins.md013.code_blocks = true
