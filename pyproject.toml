[project]
name = "subtitle-tool"
version = "0.1.0"
description = "Self-hosted tool that keeps Plex subtitle files clean and consistently named"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.49.0",
    "pysubs2>=1.7",
    "charset-normalizer>=3.3",
    "lingua-language-detector>=2.0",
    "jinja2>=3.1",
    "tomli-w>=1.0",
    "python-multipart>=0.0.9",
    "watchdog>=6.0.0",
    "ffsubsync>=0.4.32",
    "iso639-lang>=2.6.3",
    "srt>=3.5.3",
]

[project.scripts]
subtitle-tool = "subtitle_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tool"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PIE",
    "RET",
    "RSE",
    "ICN",
    "TID",
    "FURB",
    "LOG",
    "ISC",
    "INP",
    "G",
]

# Coverage measures only the application package; tests are excluded from the
# reported total. The gate command is `uv run pytest --cov` (see AGENTS.md and
# .githooks/README.md). fail_under is the agreed minimum threshold and the
# single source of truth for it, kept low enough to leave room for the
# intentionally hard-to-cover subprocess and safety branches.
[tool.coverage.run]
source = ["src/subtitle_tool"]

[tool.coverage.report]
show_missing = true
fail_under = 90
