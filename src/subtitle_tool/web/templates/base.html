<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Subtitle Tool{% endblock %}</title>
  <!-- Project-owned CSS, loaded in dependency order: tokens first (custom
       properties), then base shell, shared components, forms, and tables.
       See src/subtitle_tool/web/AGENTS.md for the file boundaries. -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/forms.css">
  <link rel="stylesheet" href="/static/css/tables.css">
</head>
<body data-page="{% block page %}{% endblock %}"{% block body_attrs %}{% endblock %}>
  {% set current_page = self.page() | trim %}
  <div class="layout">
    <header class="sidebar">
      <nav>
        <a href="/" class="brand">Subtitle Tool</a>
        <a href="/"{% if current_page == "dashboard" %} class="active" aria-current="page"{% endif %}>Dashboard</a>
        <a href="/library"{% if current_page == "library" %} class="active" aria-current="page"{% endif %}>Library</a>
        <a href="/config"{% if current_page == "config" %} class="active" aria-current="page"{% endif %}>Configuration</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <!-- app.js runs before Alpine so its alpine:init listener is registered
       before Alpine's deferred start() microtask dispatches that event. -->
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/alpine.csp.min.js" defer></script>
</body>
</html>
